name: Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  postgres-redis-testcontainers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: testcontainers*

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run integration suite (first clean execution)
        run: npm test 2>&1 | tee first-run.log

      - name: Run integration suite again (repeatability)
        run: npm test 2>&1 | tee second-run.log

      - name: Publish concise test evidence
        if: always()
        run: |
          {
            echo '## PostgreSQL + Redis integration evidence'
            echo
            echo '```text'
            grep -E 'Testcontainers\]|Test Files|Tests ' first-run.log || true
            grep -E 'Testcontainers\]|Test Files|Tests ' second-run.log || true
            echo '```'
            echo
            echo 'Both executions used disposable Testcontainers with dynamic host ports.'
          } >> "$GITHUB_STEP_SUMMARY"
          containers="$(grep -E 'Testcontainers\]' first-run.log | sed 's/^.*\(\[Testcontainers\]\)/\1/' | head -n 1)"
          echo "::notice title=Containers started::$containers"
          grep -E 'Test Files|Tests ' first-run.log | while IFS= read -r line; do
            echo "::notice title=First execution::$line"
          done
          grep -E 'Test Files|Tests ' second-run.log | while IFS= read -r line; do
            echo "::notice title=Repeat execution::$line"
          done

      - name: Show Docker state if a test fails
        if: failure()
        run: docker ps -a
